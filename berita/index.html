<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Artikel</title>

    <link rel="icon" type="image/png" href="/assets/img/logo-fosbon.png">
    <link rel="stylesheet" href="/css/berita.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/berita-update.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">
            <img src="/assets/img/logo-fosbon.png" alt="logo">
            <h1>FORUM OSIS KOTA BONTANG</h1>
        </div>

        <button class="nav-toggle" type="button" aria-label="Buka menu" aria-expanded="false">
            <i class="fa-solid fa-bars"></i>
        </button>

        <nav class="nav-links">
            <a href="/" class="nav-item">Home</a>
            <a href="/berita/" class="nav-item">Berita</a>

            <!-- Parent DROPDOWN PROFIL -->
            <div class="dropdown nav-item">
                <button class="dropdown-toggle" type="button" aria-haspopup="true" aria-expanded="false">
                    Profil
                    <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                </button>

                <div class="dropdown-content">
                    <a href="/visi-misi/">Visi & Misi</a>
                    <a href="/struktur/">Struktur Organisasi</a>
                </div>
            </div>

            <a href="/galeri/" class="nav-item">Galeri</a>
        </nav>
    </header>
    
<!-- UPDATE TERBARU: berita featured dari beritaData, BUKAN medsos -->
    <section class="berita-update">
        <div class="update-title">
            <h2>Update Terbaru</h2>
            <p>Informasi dan kabar terbaru melalui Media Sosial</p>
        </div>
 
        <div class="update-slider">
            <button class="update-nav prev" id="featuredPrev" aria-label="Sebelumnya">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            
            <div class="update-track" id="featuredContainer"></div>
 
            <button class="update-nav next" id="featuredNext" aria-label="Selanjutnya">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </section>

    <section class="berita-section">
    <div class="berita-title">
        <h1>Berita FOSBON</h1>
        <p>Informasi kegiatan Forum OSIS Kota Bontang</p>
    </div>
    <div class="berita-container" id="beritaContainer"></div>
</section>

<script src="/js/nav.js"></script>
<script src="/js/update-data.js"></script>
<script src="/js/update.js"></script>
<script src="/js/berita-data.js"></script>
<script src="/js/berita.js"></script>

</body>
</html>
