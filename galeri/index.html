<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Galeri</title>

    <link rel="stylesheet" href="/css/gallery.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="icon" type="image/png" href="/assets/img/logo-fosbon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">
            <img src="/assets/img/logo-fosbon.png" alt="logo">
            <h1>FORUM OSIS KOTA BONTANG</h1>
        </div>

        <button class="nav-toggle" type="button" aria-label="Buka menu" aria-expanded="false">
            <i class="fa-solid fa-bars"></i>
        </button>

        <nav class="nav-links">
            <a href="/" class="nav-item">Home</a>
            <a href="/berita/" class="nav-item">Berita</a>

            <!-- Parent DROPDOWN PROFIL -->
            <div class="dropdown nav-item">
                <button class="dropdown-toggle" type="button" aria-haspopup="true" aria-expanded="false">
                    Profil
                    <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                </button>

                <div class="dropdown-content">
                    <a href="/visi-misi/">Visi & Misi</a>
                    <a href="/struktur/">Struktur Organisasi</a>
                </div>
            </div>

            <a href="/galeri/" class="nav-item">Galeri</a>
        </nav>
    </header>

<!-- =========================
     SECTION GALLERY
========================= -->
<section class="gallery-section">
    <!-- Judul -->
    <div class="gallery-title">
        <h1>Galeri Kegiatan</h1>
        <p>Dokumentasi kegiatan Forum OSIS Kota Bontang</p>
    </div>
    <div class="gallery-container" id="galleryContainer"></div>
</section>

<div class="multi-gallery-popup" id="multiGallery">
    <span class="multi-close"
    onclick="tutupMultiGallery()">
    &times;
    </span>
    <div class="multi-gallery-content" id="multiGalleryContent">
    </div>
</div>

<!-- =========================
     POPUP GALLERY
========================= -->
<div class="gallery-popup" id="galleryPopup">
    <div class="popup-content">
        <span class="close-popup" 
            onclick="tutupGallery()">
            &times;
        </span> <!-- Tombol close -->
        <div class="popup-image"> <!-- Kiri -->
            <img id="popup-img">
        </div>
        <div class="popup-text"> <!-- Kanan -->
            <h2 id="popup-title"></h2>
            <p class="popup-date" id="popup-date"></p>
            <p class="popup-desc" id="popup-desc"></p>
        </div>
    </div>
</div>


<script src="/js/nav.js"></script>
<script src="/js/gallery.js"></script>

</body>
</html>
